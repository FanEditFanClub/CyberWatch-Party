<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberWatch Party</title>
    <!-- Discord Embedded App SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.15.0/dist/index.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0c0c0e;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
        }
        #player-container {
            width: 100%;
            height: 100%;
            background: #000;
        }
        /* Changed from iframe to video element styling */
        video {
            width: 100%;
            height: 100%;
            outline: none;
        }
        .status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            color: #8a8e94;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="player-container">
        <!-- Replaced iframe with a native video player -->
        <video id="video-player" controls allow="autoplay; fullscreen; picture-in-picture">
            <source src="https://pub-06cd9728d5bf4c4f8f2a9c2bb7a1e9ae.r2.dev/Spider-Noir%20-%20Season%201%20-%20Movie%20Fan%20Edit.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    
    <div class="status" id="connectionStatus">Watch Party Ready</div>

    <script>
        async function setupDiscord() {
            try {
                const discordSdk = new DiscordSDK({ clientId: '1533128488146567381' });
                await discordSdk.ready();
                document.getElementById('connectionStatus').innerText = "Connected to Discord Voice Channel";
            } catch (err) {
                document.getElementById('connectionStatus').innerText = "Watch Party Ready";
            }
        }
        setupDiscord();
    </script>
</body>
</html>
