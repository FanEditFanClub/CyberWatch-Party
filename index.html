<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberWatch Party</title>
    <!-- Discord Embedded App SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.15.0/dist/index.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0c0c0e;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #player-container {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16/9;
            background: #000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            outline: none;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #8a8e94;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <video id="videoPlayer" controls playsinline preload="auto">
            <source src="Spider-Noir%20-%20Season%201%20-%20Movie%20Fan%20Edit.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    
    <div class="status" id="connectionStatus">Watch Party Ready</div>

    <script>
        // Non-blocking initialization for Discord context
        async function setupDiscord() {
            try {
                const discordSdk = new DiscordSDK({ clientId: '1533128488146567381' });
                await discordSdk.ready();
                document.getElementById('connectionStatus').innerText = "Connected to Discord Voice Channel";
            } catch (err) {
                document.getElementById('connectionStatus').innerText = "Watch Party Ready";
            }
        }
        setupDiscord();
    </script>
</body>
</html>
