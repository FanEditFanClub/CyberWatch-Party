<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberWatch Party</title>
    <!-- Discord Embedded App SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.15.0/dist/index.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0c0c0e;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
        }
        #player-container {
            width: 100%;
            height: 100%;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            color: #8a8e94;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <iframe src="https://rumble.com/embed/v7be8ee/?pub=4q5tes" sandbox="allow-scripts allow-same-origin allow-presentation allow-bowser" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </div>
    
    <div class="status" id="connectionStatus">Watch Party Ready</div>

    <script>
        async function setupDiscord() {
            try {
                const discordSdk = new DiscordSDK({ clientId: '1533128488146567381' });
                await discordSdk.ready();
                document.getElementById('connectionStatus').innerText = "Connected to Discord Voice Channel";
            } catch (err) {
                document.getElementById('connectionStatus').innerText = "Watch Party Ready";
            }
        }
        setupDiscord();
    </script>
</body>
</html>
